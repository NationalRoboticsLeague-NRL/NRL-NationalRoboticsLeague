[platformio]
src_dir = src
default_envs = robot

[env:robot]
platform              = espressif32@^6.4.0
board                 = esp32-s3-devkitc-1
framework             = arduino
monitor_speed         = 115200
board_build.partitions = partitions.csv

; Compile opmodes/ alongside src/ — students only ever open opmodes/
build_src_filter = +<**/*> +<../opmodes/**/*>

; FreeRTOS at 1000Hz ticks — gives 1ms resolution for vTaskDelayUntil
build_unflags = -std=gnu++11 -std=c++11

build_flags =
    -DCONFIG_FREERTOS_HZ=1000
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; NOTE: no licence-related build flag belongs in this file, and none is read
; from it. This file is copied verbatim into every generated student project and
; ships in the public kit, so treat everything in it as public.
;
; Licence behaviour is fixed at kit-build time by the keys compiled into
; libHexaNRL_static.a -- it is not configurable from here, and adding a flag
; would not change it.

lib_deps =
    adafruit/Adafruit NeoPixel
    adafruit/Adafruit LSM6DS
    adafruit/Adafruit Unified Sensor

; RobotFirmware/lib  = runner, comms, gamepad, NRL umbrella, RobotConfig
; Root lib/Hexa*     = hardware drivers (HexaServos, HexaOLED, HexaIMU, HexaHAL)
; NOTE: root lib/HexaNRL deliberately excluded — its name clashes with this lib/HexaNRL
lib_extra_dirs =
    lib
    ../lib/HexaServos
    ../lib/HexaOLED
    ../lib/HexaIMU
    ../lib/HexaHAL
    ../lib/HexaLED
    ../lib/HexaPower

; ── Bench-only: link fault injection ────────────────────────────────────────
; Same as [env:robot] plus the "drop <ms>" serial command, which fakes a total
; RF blackout without touching the radio (see NRLComms.h). Deterministic and
; repeatable, unlike shielding or distance. NEVER ship this env — the flag is
; absent from [env:robot], so the hook compiles out of the student build.
;   pio run -e robot-linktest -t upload
[env:robot-linktest]
extends    = env:robot
build_flags = ${env:robot.build_flags}
    -DNRL_LINK_FAULT_INJECTION

; ── Bench-only: watchdog race, widened ──────────────────────────────────────
; robot-linktest plus a 200us hold inside tickPairing() between sampling the
; clock and reading the controller's last-packet timestamp. That window is a
; few microseconds in a real build, so the race only fires now and then; held
; open, ordinary controller packets hit it within a minute or so. Lets a bench
; run show whether the race can still end a match. NEVER ship this env.
;   pio run -e robot-racetest -t upload
[env:robot-racetest]
extends    = env:robot
build_flags = ${env:robot-linktest.build_flags}
    -DNRL_RACE_WIDEN_US=200
